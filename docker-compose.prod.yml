# Production-ready compose configuration.
#
# This is intentionally a *standalone* file rather than a docker-compose.yml
# override: Docker Compose merges list-type fields (ports, command, ...)
# across `-f` files by concatenation, not replacement, so an override alone
# cannot reliably remove the host port bindings docker-compose.yml exposes
# for local development. Keeping this self-contained avoids that footgun.
#
# Usage:
#   cp .env.prod.example .env.prod   # fill in real secrets, do NOT commit
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Differences from docker-compose.yml (dev):
#   - Secrets come from environment variables (via --env-file), never
#     hardcoded here or baked into an image layer.
#   - Postgres and Redis do not publish ports to the host - only reachable
#     by other containers on the compose network, not from the host machine.
#   - Redis requires a password.
#   - restart: unless-stopped, so services recover from a crash/host reboot.
#   - No bind-mounted source code / no --reload: containers run exactly the
#     code baked into the image at build time.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fabbi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabbi -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.prod}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.prod}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://fabbi:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}@postgres:5432/postgres
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.prod}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env.prod}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
