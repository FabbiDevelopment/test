services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fabbi_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super_secure_db_pass}
      POSTGRES_DB: ${POSTGRES_DB:-postgres_prod}
    # REMOVED ports to prevent external access
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fabbi_prod} -d ${POSTGRES_DB:-postgres_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:-super_secure_redis_pass}"
    # REMOVED ports to prevent external access
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-super_secure_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fabbi_prod}:${POSTGRES_PASSWORD:-super_secure_db_pass}@postgres:5432/${POSTGRES_DB:-postgres_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-super_secure_redis_pass}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-must_be_changed_in_prod}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:3000" # Map production port 80 to container 3000
    environment:
      VITE_API_URL: ${API_URL:-http://api.yourdomain.com}
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data_prod:
